<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- Raidar favicon, SMALL (16/32px).
       INVERTED on purpose: orange mark on a DARK tile, not a full-bleed orange
       tile. Raidar's accent (#FF6A3D) sits adjacent to Cloudflare's brand amber
       (#F38020), and at tab-strip scale two orange tiles reduce to the same
       blob. A dark ground gives a silhouette no neighbour in a typical strip
       shares, so the reticle geometry does the identifying instead of the hue.
       Corner brackets are 2px on integer boundaries — 1px arms vanish at
       fractional DPR (1.25x / 1.5x). -->
  <rect width="16" height="16" rx="3.5" fill="#0B0D11"/>
  <rect x="0.5" y="0.5" width="15" height="15" rx="3.2" fill="none" stroke="#FF6A3D" stroke-width="1" opacity="0.25"/>
  <path d="M3 5V3h2M11 3h2v2M13 11v2h-2M5 13H3v-2"
        stroke="#FF6A3D" stroke-width="2" stroke-linecap="butt" fill="none"/>
  <circle cx="8" cy="8" r="2.4" fill="#FF6A3D"/>
</svg>
